<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Love Letter From Darcy & Lizzie</title>

  <!-- Preview saat link dibagikan di WhatsApp -->
  <meta property="og:title" content="The Wedding of Darcy & Lizzie">
  <meta property="og:description" content="Tanpa mengurangi rasa hormat, kami mengundang Bapak/Ibu/Saudara(i) untuk hadir di acara pernikahan kami.">
  <meta property="og:image" content="bg-cover.png">

  <!-- Google Fonts (Fallback mirip gaya serif klasik & tulisan tangan Singel) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Single+Day&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'SingelCustom';
      src: url('./Singel.woff2') format('woff2'),
           url('./Singel.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #3d050a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .cover-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      aspect-ratio: 9 / 16;
      background-image: url('./bg-cover.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    /* 1. TOMBOL BUKA UNDANGAN DI LINGKARAN WAX SEAL EMAS */
    .seal-button {
      position: absolute;
      top: 59%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 31%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      /* Disembunyikan sementara sampai kode tamu terverifikasi valid */
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: #4a1216;
      background: radial-gradient(circle, rgba(255, 243, 200, 0.72) 0%, rgba(218, 178, 92, 0.25) 75%, transparent 100%);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(11px, 2.8vw, 13px);
      letter-spacing: 0.8px;
      line-height: 1.25;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      animation: pulseSeal 2.2s infinite ease-in-out;
      transition: transform 0.2s ease;
    }

    .seal-button:hover {
      transform: translate(-50%, -50%) scale(1.06);
    }

    .seal-button:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    @keyframes pulseSeal {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(235, 198, 115, 0.55);
      }
      50% {
        box-shadow: 0 0 18px 8px rgba(235, 198, 115, 0.25);
      }
    }

    /* 2. TEKS NAMA TAMU UNDANGAN */
    .guest-name {
      position: absolute;
      top: 82.2%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      text-align: center;
      color: #ffffff;
      font-family: 'SingelCustom', 'Single Day', 'Cinzel', serif;
      font-size: clamp(20px, 4.9vw, 23px);
      font-weight: 600;
      letter-spacing: 1px;
      line-height: 1.3;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <div class="cover-wrapper">
    <!-- Tombol di dalam lingkaran wax seal emas -->
    <a id="open-invitation-btn" href="./undangan.html" class="seal-button">
      Buka<br>Undangan
    </a>

    <!-- Nama Tamu Dinamis -->
    <div id="guest-name-display" class="guest-name">
      Memuat undangan...
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFDWH96SC02-6vxWI7KhRVyZ2wIGHuwWPxOf4fHpqRE6qAtK0eHpAjQDTwKOmUm7bW/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const kodeId = urlParams.get('id');

    const guestDisplay = document.getElementById('guest-name-display');
    const openBtn = document.getElementById('open-invitation-btn');

    async function verifikasiTamu() {
      if (!kodeId || kodeId.trim() === "") {
        tampilkanAksesDitolak();
        return;
      }

      try {
        const res = await fetch(`${SCRIPT_URL}?id=${encodeURIComponent(kodeId.trim())}`);
        const data = await res.json();

        if (data.valid && data.nama) {
          guestDisplay.innerText = data.nama;
          openBtn.href = `./undangan.html?id=${encodeURIComponent(kodeId.trim())}`;
          openBtn.style.display = "flex"; // Tampilkan tombol hanya jika kode valid
        } else {
          tampilkanAksesDitolak();
        }
      } catch (err) {
        guestDisplay.innerHTML = "<span style='font-family: sans-serif; font-size: 13px; color: #ffde59;'>Gagal memuat data. Silakan refresh halaman.</span>";
      }
    }

    function tampilkanAksesDitolak() {
      guestDisplay.innerHTML = "<span style='font-family: sans-serif; font-size: 13px; font-weight: 500; color: #ffde59; letter-spacing: 0;'>Maaf, tautan undangan tidak valid atau tidak terdaftar.</span>";
      openBtn.style.display = "none";
    }

    verifikasiTamu();
  </script>

</body>
</html>
